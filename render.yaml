services:
  - type: web
    name: berea-marketplace-api
    runtime: python
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    preDeployCommand: alembic upgrade head
    startCommand: uvicorn app.main:app --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/v1/health
    envVars:
      # Pinned: Python 3.14 breaks some dependencies (e.g. psycopg2-binary wheels).
      - key: PYTHON_VERSION
        value: 3.13.3
      - key: DATABASE_URL
        fromDatabase:
          name: berea-marketplace-db
          property: connectionString
      - key: SECRET_KEY
        generateValue: true
      - key: ALGORITHM
        value: HS256
      - key: ACCESS_TOKEN_EXPIRE_MINUTES
        value: "1440"
      - key: VERIFICATION_CODE_EXPIRE_MINUTES
        value: "15"
      - key: CLOUDINARY_CLOUD_NAME
        sync: false
      - key: CLOUDINARY_API_KEY
        sync: false
      - key: CLOUDINARY_API_SECRET
        sync: false
      - key: RESEND_API_KEY
        sync: false
      - key: EMAIL_FROM
        value: onboarding@resend.dev
      # Must be a JSON list, e.g. ["https://your-site.netlify.app"]
      - key: CORS_ORIGINS
        sync: false

databases:
  - name: berea-marketplace-db
    plan: free
